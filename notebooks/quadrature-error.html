<!doctype html>
<notebook theme="air">
  <title>Quadrature rules</title>
  <script id="1" type="text/markdown">
    # Simple sum, trapezoid and Simpson

    The left panel shows the area each rule actually adds up for ${tex`n`} slices;
    the right panel shows how fast each rule's error falls as ${tex`n`} grows.
  </script>
  <!-- `cells: ["controlsView", "panelsView", "readoutView"]` -->
  <script id="2" type="text/x-typescript">
    const controlsView = display(controlFields);
  </script>
  <script id="2b" type="text/x-typescript">
    const panelsView = display(panels);
  </script>
  <script id="2c" type="text/x-typescript">
    const readoutView = display(readout);
  </script>

  <script id="3" type="text/x-typescript">
    import {simpleSum, trapezoid, simpson} from "https://curiousbeams.github.io/numerics-widgets/kit/index.js"
  </script>
  <script id="3b" type="text/x-typescript">
    import {controls, badge, SERIES} from "https://curiousbeams.github.io/em-widgets/kit/ui.js"
  </script>

  <script id="4" type="text/x-typescript">
    const FUNCTIONS = {
      "x⁴ − 2x + 1 on [0, 2]": {f: (x) => x ** 4 - 2 * x + 1, a: 0, b: 2, exact: 4.4},
      "sin x on [0, π]": {f: Math.sin, a: 0, b: Math.PI, exact: 2},
      "√x on [0, 1]": {f: Math.sqrt, a: 0, b: 1, exact: 2 / 3}
    }
  </script>
  <script id="4b" type="text/x-typescript">
    const RULES = [
      {name: "simple sum", rule: simpleSum, colour: SERIES[0], order: 1},
      {name: "trapezoid", rule: trapezoid, colour: SERIES[1], order: 2},
      {name: "Simpson", rule: simpson, colour: SERIES[2], order: 4}
    ]
  </script>
  <script id="5" type="text/x-typescript">
    const controlFields = controls(
      Inputs.form({
        fn: Inputs.select(Object.keys(FUNCTIONS), {label: "integral"}),
        n: Inputs.range([2, 40], {value: 4, step: 2, label: "slices n"}),
        draw: Inputs.radio(RULES.map((r) => r.name), {value: "trapezoid", label: "draw"})
      }),
      {columns: 3, minWidth: 170, compact: true}
    )
  </script>
  <script id="6" type="text/x-typescript">
    const settings = Generators.input(controlFields)
  </script>

  <script id="7" type="text/x-typescript">
    const study = (() => {
      const {f, a, b, exact} = FUNCTIONS[settings.fn];
      const ns = [2, 4, 6, 8, 12, 16, 24, 32, 48, 64, 96, 128, 192, 256, 384, 512, 768, 1024];
      const rows = RULES.flatMap(({name, rule}) =>
        ns.map((n) => ({n, name, error: Math.max(Math.abs(rule(f, a, b, n) - exact), 1e-16)})));
      const now = RULES.map(({name, rule}) => ({name, value: rule(f, a, b, settings.n)}));
      return {f, a, b, exact, rows, now};
    })()
  </script>

  <script id="8" type="text/x-typescript">
    // The shape each rule integrates on every slice: a flat top (left end point),
    // a straight line, or a parabola through each pair of slices.
    const approximation = (() => {
      const {f, a, b} = study;
      const n = settings.n, h = (b - a) / n;
      const xi = (i) => a + i * h;
      if (settings.draw === "simple sum") {
        return Array.from({length: n}, (_, i) => [{x: xi(i), y: f(xi(i))}, {x: xi(i + 1), y: f(xi(i))}]).flat();
      }
      if (settings.draw === "trapezoid") return Array.from({length: n + 1}, (_, i) => ({x: xi(i), y: f(xi(i))}));
      const pts = [];
      for (let k = 0; k < n; k += 2) {
        const [x0, x1, x2] = [xi(k), xi(k + 1), xi(k + 2)];
        const [y0, y1, y2] = [f(x0), f(x1), f(x2)];
        for (let j = 0; j <= 20; j++) {
          const x = x0 + ((x2 - x0) * j) / 20;
          // Lagrange parabola through the three points
          const y = y0 * ((x - x1) * (x - x2)) / ((x0 - x1) * (x0 - x2))
                  + y1 * ((x - x0) * (x - x2)) / ((x1 - x0) * (x1 - x2))
                  + y2 * ((x - x0) * (x - x1)) / ((x2 - x0) * (x2 - x1));
          pts.push({x, y});
        }
      }
      return pts;
    })()
  </script>

  <script id="9" type="text/x-typescript">
    const panels = (() => {
      const {f, a, b, rows} = study;
      const side = width >= 600;
      const w = side ? Math.floor((width - 16) / 2) : width;
      const colour = RULES.find((r) => r.name === settings.draw).colour;
      const xs = Array.from({length: 300}, (_, i) => a + ((b - a) * i) / 299);
      const nodes = Array.from({length: settings.n + 1}, (_, i) => a + ((b - a) * i) / settings.n);
      const shape = Plot.plot({
        width: w, height: 250, marginLeft: 40, marginRight: 10, marginTop: 10, marginBottom: 34,
        x: {label: "x", labelAnchor: "center"}, y: {label: "f(x)", labelAnchor: "center"},
        marks: [
          Plot.ruleY([0], {strokeOpacity: 0.3}),
          Plot.areaY(approximation, {x: "x", y: "y", fill: colour, fillOpacity: 0.25, curve: "linear"}),
          Plot.line(approximation, {x: "x", y: "y", stroke: colour, strokeWidth: 1.4, curve: "linear"}),
          Plot.ruleX(nodes, {stroke: colour, strokeOpacity: 0.35}),
          Plot.line(xs.map((x) => ({x, y: f(x)})), {x: "x", y: "y", stroke: "currentColor", strokeWidth: 2}),
          Plot.dot(nodes.map((x) => ({x, y: f(x)})), {x: "x", y: "y", r: 2.5, fill: "currentColor"})
        ]
      });
      const guide = (p, c) => [2, 1024].map((n) => ({n, e: c * (n / 2) ** -p}));
      const startErr = (name) => rows.find((r) => r.name === name && r.n === 2).error;
      const errors = Plot.plot({
        width: w, height: 250, marginLeft: 50, marginRight: 10, marginTop: 10, marginBottom: 34,
        x: {type: "log", domain: [2, 1024], label: "slices n", labelAnchor: "center"},
        y: {type: "log", domain: [1e-16, 10], label: "error |I − exact|", labelAnchor: "center", ticks: 6,
            tickFormat: (v) => `1e${Math.round(Math.log10(v))}`},
        color: {domain: RULES.map((r) => r.name), range: RULES.map((r) => r.colour)},
        marks: [
          ...RULES.map((r) => Plot.line(guide(r.order, startErr(r.name)), {x: "n", y: "e", stroke: "currentColor", strokeOpacity: 0.25, strokeDasharray: "3,3", clip: true})),
          Plot.text(RULES.map((r) => ({n: 600, e: startErr(r.name) * 300 ** -r.order * 3, t: `∝ 1/n${r.order === 1 ? "" : r.order === 2 ? "²" : "⁴"}`})),
            {x: "n", y: "e", text: "t", fontSize: 11, fillOpacity: 0.6, clip: true}),
          Plot.line(rows, {x: "n", y: "error", stroke: "name", strokeWidth: 1.6}),
          Plot.ruleX([settings.n], {strokeOpacity: 0.5}),
          Plot.dot(rows.filter((r) => r.n === settings.n), {x: "n", y: "error", fill: "name", r: 4})
        ]
      });
      const legend = htl.html`<div style="font-size:12px; display:flex; gap:14px; flex-wrap:wrap;
        color:var(--theme-foreground-muted, inherit); margin:0 0 2px;">
        ${RULES.map((r) => htl.html`<span><b style="color:${r.colour}">——</b> ${r.name}</span>`)}
      </div>`;
      return htl.html`<div>${legend}<div style="display:flex; gap:16px; flex-wrap:wrap;">${shape}${errors}</div></div>`;
    })()
  </script>

  <script id="10" type="text/x-typescript">
    const readout = badge()
  </script>
  <script id="11" type="text/x-typescript">
    const summary = (() => {
      const {exact, now} = study;
      readout.textContent = `n = ${settings.n} slices, exact ${exact.toPrecision(6)} · ` + now
        .map(({name, value}) => `${name} ${value.toPrecision(8)} (error ${Math.abs(value - exact).toExponential(1)})`)
        .join(" · ");
      return readout.textContent;
    })()
  </script>
</notebook>
